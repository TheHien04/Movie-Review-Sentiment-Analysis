services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-sentiment-backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_APP=backend/app.py
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - CACHE_ENABLED=True
      - RATE_LIMIT_ENABLED=True
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_PREDICT_PER_MINUTE=10
      - HUB_MODEL_FALLBACK=distilbert-base-uncased-finetuned-sst-2-english
    volumes:
      - ./logs:/app/logs
      - ./sentiment_model:/app/sentiment_model
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  # Frontend Service (Nginx)
  frontend:
    image: nginx:alpine
    container_name: movie-sentiment-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-sentiment-fastapi
    ports:
      - "8001:8001"
    environment:
      - FLASK_ENV=production
      - HUB_MODEL_FALLBACK=distilbert-base-uncased-finetuned-sst-2-english
      - RAG_ENABLED=True
    volumes:
      - ./sentiment_model:/app/sentiment_model
      - ./data:/app/data
    command: uvicorn backend.fastapi_app:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    networks:
      - sentiment-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    container_name: movie-sentiment-vllm
    ports:
      - "8002:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command: >
      --model meta-llama/Llama-3.2-1B-Instruct
      --host 0.0.0.0 --port 8000
    networks:
      - sentiment-network
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  triton:
    profiles: ["triton"]
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: movie-sentiment-triton
    ports:
      - "8003:8000"
    volumes:
      - ./deploy/triton/model_repository:/models
    command: tritonserver --model-repository=/models
    networks:
      - sentiment-network

networks:
  sentiment-network:
    driver: bridge

volumes:
  logs:
  model-data:
