name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: flake8 (errors only)
        run: |
          flake8 backend/ scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: black --check
        run: black --check backend/ scripts/ tests/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r backend/requirements.txt

      - name: Bandit (medium+ severity fails)
        run: |
          bandit -r backend/ -c bandit.yaml -ll -ii -q

      - name: pip-audit (dependencies)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: pytest
        env:
          HUB_MODEL_FALLBACK: distilbert-base-uncased-finetuned-sst-2-english
          RATE_LIMIT_ENABLED: "False"
          CACHE_ENABLED: "False"
          WANDB_MODE: disabled
          MLFLOW_ENABLED: "false"
        run: |
          pytest tests/ -q --cov=backend --cov-report=term-missing --cov-fail-under=0

  kubernetes:
    name: Kubernetes & Helm
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Install YAML deps
        run: |
          python -m pip install --upgrade pip pyyaml

      - name: Validate K8s manifests (core + Istio + multi-region)
        run: |
          for f in deploy/kubernetes/*.yaml deploy/kubernetes/istio/*.yaml deploy/kubernetes/multi-region/*.yaml; do
            python -c "import yaml,sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"
          done

      - name: Helm lint and template (multi-region)
        run: |
          helm lint deploy/helm/cinesentiment
          helm template cinesentiment deploy/helm/cinesentiment > /dev/null
          helm template cinesentiment-us deploy/helm/cinesentiment -f deploy/helm/cinesentiment/values-us-east.yaml > /dev/null
          helm template cinesentiment-eu deploy/helm/cinesentiment -f deploy/helm/cinesentiment/values-eu-west.yaml > /dev/null

  e2e-playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run browser E2E
        working-directory: e2e
        env:
          HUB_MODEL_FALLBACK: distilbert-base-uncased-finetuned-sst-2-english
          RATE_LIMIT_ENABLED: "False"
          CACHE_ENABLED: "False"
          WANDB_MODE: disabled
          CI: "true"
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, security, test, kubernetes]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t cinesentiment:ci .

  artifacts:
    name: Verify artifacts
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Check evaluation.json if present
        run: |
          if [ -f artifacts/results/evaluation.json ]; then
            python -c "import json; d=json.load(open('artifacts/results/evaluation.json')); assert 'splits' in d"
            echo "evaluation.json OK"
          else
            echo "evaluation.json not committed — run make capstone locally"
          fi
