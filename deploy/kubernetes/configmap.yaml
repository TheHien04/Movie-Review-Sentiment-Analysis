apiVersion: v1
kind: ConfigMap
metadata:
  name: cinesentiment-config
  namespace: cinesentiment
data:
  FLASK_ENV: "production"
  DEBUG: "False"
  RATE_LIMIT_ENABLED: "True"
  CACHE_ENABLED: "True"
  PROMETHEUS_ENABLED: "true"
  HUB_MODEL_FALLBACK: "distilbert-base-uncased-finetuned-sst-2-english"
  GUNICORN_WORKERS: "2"
