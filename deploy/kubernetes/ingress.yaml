apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinesentiment-ingress
  namespace: cinesentiment
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: cinesentiment.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinesentiment-backend
                port:
                  number: 80
          - path: /api/v2
            pathType: Prefix
            backend:
              service:
                name: cinesentiment-fastapi
                port:
                  number: 80
