apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cinesentiment
  namespace: cinesentiment
spec:
  hosts:
    - cinesentiment.local
  gateways:
    - cinesentiment-gateway
  http:
    - match:
        - uri:
            prefix: /api/v2
      route:
        - destination:
            host: cinesentiment-fastapi
            port:
              number: 8001
    - match:
        - uri:
            prefix: /modern
      route:
        - destination:
            host: cinesentiment-backend
            port:
              number: 8000
    - route:
        - destination:
            host: cinesentiment-backend
            port:
              number: 8000
          weight: 100
